name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use release npm version
        run: npm install --global npm@12.2.1

      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^\d+\.\d+\.\d+$/.test(version) || tag !== `v${version}`) {
            throw new Error(`Stable release tag ${tag} must match package.json version v${version}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      # Build separately so lifecycle logs do not pollute the JSON report.
      - name: Build and inspect package
        run: |
          npm pack --ignore-scripts --dry-run --json > "$RUNNER_TEMP/package.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/package.json`, 'utf8'));
          const paths = new Set(pack.files.map(file => file.path));
          for (const file of ['dist/web-booster.esm.js', 'dist/web-booster.min.js', 'dist/web-booster.css']) {
            if (!paths.has(file)) throw new Error(`Missing release artifact: ${file}`);
          }
          console.log(`Verified ${pack.name}@${pack.version}: ${pack.files.length} files`);
          NODE

      - name: Publish with npm trusted publishing
        run: npm publish --ignore-scripts --access public
